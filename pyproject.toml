[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-lens"
version = "1.0.0"
description = "Local CLI for filtering, searching, summarizing, and following text logs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["logs", "cli", "observability", "developer-tools"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.scripts]
log-lens = "log_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
